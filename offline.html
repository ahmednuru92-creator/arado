<!DOCTYPE html>
<html lang="am" dir="ltr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ደሴ ማርት — ኢንተርኔት አልተገናኘም</title>
  
  <link rel="icon" type="image/png" sizes="192x192" href="https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=192&auto=format&fit=crop&q=80">
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#1254d6"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    body { font-family: 'Noto Sans Ethiopic', sans-serif; }
  </style>
</head>
<body class="bg-[#0b0f19] text-white flex items-center justify-center min-h-screen px-4 text-center">

  <div class="max-w-sm w-full bg-slate-900/80 p-6 rounded-3xl border border-slate-800 shadow-2xl">
    <div class="w-16 h-16 rounded-2xl bg-slate-800 text-amber-500 flex items-center justify-center mx-auto mb-4">
      <span class="material-symbols-outlined text-3xl">wifi_off</span>
    </div>

    <h1 class="text-lg font-extrabold mb-1">ኢንተርኔት አልተገናኘም</h1>
    <p class="text-xs text-slate-400 mb-6 leading-relaxed">
      እባክዎ የኔትወርክ ወይም የዋይፋይ (Wi-Fi) ግንኙነትዎን ያረጋግጡና እንደገና ይሞክሩ።
    </p>

    <button onclick="window.location.reload()" class="w-full py-3 rounded-2xl bg-[#1254d6] hover:bg-blue-600 active:scale-95 transition-all text-xs font-bold flex items-center justify-center gap-2">
      <span class="material-symbols-outlined text-base">refresh</span>
      <span>እንደገና ሞክር</span>
    </button>
  </div>

</body>
</html>
